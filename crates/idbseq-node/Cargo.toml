[package]
name = "idbseq-node"
description = "Native module behind IdbSeqDatabase in the idbseq npm package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
# A Node module: its symbols resolve only when Node loads it, so a Rust test
# binary cannot link. It is tested from Node (sdk/node/test/embedded.*.test.ts).
test = false
doctest = false

[dependencies]
idbseq = { path = "../idbseq" }
napi = { version = "3.16", default-features = false, features = ["napi4", "tokio_rt"] }
napi-derive = "3.7"

[build-dependencies]
napi-build = "2.6"

# Not `[lints] workspace = true`: the napi macros expand to `unsafe` FFI glue,
# which the workspace's `forbid(unsafe_code)` would reject. The code written in
# this crate has none.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
