name: Release

# Tagging `v*` (the tag must equal the version in Cargo.toml, sdk/node and
# sdk/mcp, and its commit must be on main):
#   - builds idbseqd and idbseq for Linux (gnu and musl), macOS and Windows,
#     x86_64 and arm64, and publishes them with SHA-256 checksums as a GitHub
#     Release;
#   - pushes a multi-arch image to ghcr.io/<this repository>;
#   - builds the embedded module for 8 platforms, installs the packed npm
#     packages on Linux (glibc and musl), macOS and Windows and uses them;
#   - in the public repository only (aevantec/idbseq), publishes to npm
#     (@idbseq/<platform>, idbseq, idbseq-mcp) and crates.io (idbseq-core,
#     idbseq).
#
# Run it by hand (Actions → Release → Run workflow) for a dry run: everything
# is built and tested, nothing is published.
#
# One-time setup and the release checklist: docs/releasing.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The same versions as the Dockerfile.
  ZIG_VERSION: 0.17.1

jobs:
  verify:
    name: Versions and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
      is-release: ${{ steps.version.outputs.is-release }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        name: Compare the tag with Cargo.toml, sdk/node and sdk/mcp
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          node="$(node -p "require('./sdk/node/package.json').version")"
          mcp="$(node -p "require('./sdk/mcp/package.json').version")"
          echo "Cargo.toml ${cargo}, sdk/node ${node}, sdk/mcp ${mcp}"
          if [[ "${node}" != "${cargo}" || "${mcp}" != "${cargo}" ]]; then
            echo "::error::Cargo.toml, sdk/node and sdk/mcp must have the same version"
            exit 1
          fi
          if [[ "${REF_TYPE}" == "tag" ]]; then
            if [[ "${TAG#v}" != "${cargo}" ]]; then
              echo "::error::tag ${TAG} must be v${cargo}"
              exit 1
            fi
            # A tag pushed from a branch must not publish.
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "::error::${TAG} points at a commit that is not on main"
              exit 1
            fi
            name="${TAG}"
            is_release=true
          else
            name="v${cargo}-dry-run"
            is_release=false
            echo "::notice::dry run of v${cargo}: everything is built and tested, nothing is published"
          fi
          dist_tag=latest
          if [[ "${cargo}" == *-* ]]; then dist_tag=next; fi
          {
            echo "version=${cargo}"
            echo "name=${name}"
            echo "is-release=${is_release}"
            echo "dist-tag=${dist_tag}"
          } >> "${GITHUB_OUTPUT}"

  binaries:
    name: binaries (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux targets are cross-compiled with cargo-zigbuild; gnu builds
          # link against glibc 2.28 so they run on older distributions.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, zig: '.2.28' }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, zig: '.2.28' }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: '' }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: '' }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
      - name: Install zig and cargo-zigbuild
        if: runner.os == 'Linux'
        # cargo-zigbuild finds zig through `python3 -m ziglang`.
        run: python3 -m pip install --user --break-system-packages "ziglang==${ZIG_VERSION}"
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        if: runner.os == 'Linux'
        with:
          tool: cargo-zigbuild@0.24.1
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --locked --target "${{ matrix.target }}${{ matrix.zig }}" --bin idbseqd --bin idbseq
      - name: Build (macOS, Windows)
        if: runner.os != 'Linux'
        # Windows arm64: ring builds its assembly with clang, which the runner has.
        run: cargo build --release --locked --target "${{ matrix.target }}" --bin idbseqd --bin idbseq
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ needs.verify.outputs.name }}
        run: |
          set -euo pipefail
          name="idbseq-${NAME}-${TARGET}"
          exe=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then exe=".exe"; fi
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/idbseqd${exe}" "target/${TARGET}/release/idbseq${exe}" README.md LICENSE "dist/${name}/"
          cd dist
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            archive="${name}.zip"
            7z a -tzip "${archive}" "${name}" > /dev/null
          else
            archive="${name}.tar.gz"
            tar -czf "${archive}" "${name}"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: idbseq-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [verify, binaries]
    if: needs.verify.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: idbseq-*
          merge-multiple: true
      - name: Combine checksums
        working-directory: dist
        run: |
          set -euo pipefail
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "${TAG}" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "${TAG}" dist/*.tar.gz dist/*.zip dist/*.sha256 dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --title "idbseq ${TAG}" --generate-notes "${prerelease[@]}"

  image:
    name: Docker image (GHCR)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No QEMU: the Dockerfile cross-compiles on the build host and the final
      # stage only copies files.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: needs.verify.outputs.is-release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # A dry run builds the image and pushes nothing.
          push: ${{ needs.verify.outputs.is-release == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No build cache: a release builds from scratch.

  native:
    name: embedded module (${{ matrix.napi }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, napi: darwin-arm64, os: macos-latest }
          - { target: x86_64-apple-darwin, napi: darwin-x64, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, napi: linux-x64-gnu, os: ubuntu-latest, zig: '.2.28' }
          - { target: aarch64-unknown-linux-gnu, napi: linux-arm64-gnu, os: ubuntu-latest, zig: '.2.28' }
          # A loadable module cannot link the C runtime statically (musl's default).
          - { target: x86_64-unknown-linux-musl, napi: linux-x64-musl, os: ubuntu-latest, zig: '', rustflags: '-C target-feature=-crt-static' }
          - { target: aarch64-unknown-linux-musl, napi: linux-arm64-musl, os: ubuntu-latest, zig: '', rustflags: '-C target-feature=-crt-static' }
          - { target: x86_64-pc-windows-msvc, napi: win32-x64-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, napi: win32-arm64-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
      - name: Install zig and cargo-zigbuild
        if: runner.os == 'Linux'
        run: python3 -m pip install --user --break-system-packages "ziglang==${ZIG_VERSION}"
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        if: runner.os == 'Linux'
        with:
          tool: cargo-zigbuild@0.24.1
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          TARGET: ${{ matrix.target }}
          ZIG: ${{ matrix.zig }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            cargo zigbuild --release --locked -p idbseq-node --target "${TARGET}${ZIG}"
          else
            cargo build --release --locked -p idbseq-node --target "${TARGET}"
          fi
      - name: Name it as the loader expects
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          NAPI: ${{ matrix.napi }}
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux) library=libidbseq_node.so ;;
            macOS) library=libidbseq_node.dylib ;;
            Windows) library=idbseq_node.dll ;;
          esac
          mkdir -p native
          cp "target/${TARGET}/release/${library}" "native/idbseq.${NAPI}.node"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.napi }}
          path: native/idbseq.${{ matrix.napi }}.node
          if-no-files-found: error

  npm-pack:
    name: npm packages (build, test, pack)
    # No publishing rights here: the packages are built and tested in this job
    # and only uploaded by `npm-publish`.
    needs: [verify, native]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            sdk/node/package-lock.json
            sdk/mcp/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: native-all
          pattern: native-*
          merge-multiple: true
      - name: Test the Node SDK with the Linux module built above
        working-directory: sdk/node
        run: |
          set -euo pipefail
          npm ci
          npm run build
          mkdir -p native
          cp ../../native-all/idbseq.linux-x64-gnu.node native/
          npm test
          npm run test:package
      - name: Test and build the MCP server
        working-directory: sdk/mcp
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p npm-out
          node sdk/node/scripts/npm-release.mjs platforms native-all npm-out/platforms "${VERSION}" --all
          for dir in npm-out/platforms/*/; do npm pack "./${dir}" --pack-destination npm-out; done
          node sdk/node/scripts/npm-release.mjs main sdk/node/package.json "${VERSION}"
          (cd sdk/node && npm pack --pack-destination ../../npm-out)
          node sdk/node/scripts/npm-release.mjs main sdk/mcp/package.json "${VERSION}" --mcp
          (cd sdk/mcp && npm pack --pack-destination ../../npm-out)
          ls -l npm-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: npm-out/*.tgz
          if-no-files-found: error

  npm-smoke:
    name: npm install (${{ matrix.name }})
    needs: npm-pack
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-gnu, os: ubuntu-latest }
          - { name: linux-x64-musl, os: ubuntu-latest, container: 'node:22-alpine' }
          - { name: darwin-arm64, os: macos-latest }
          - { name: win32-x64-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.container == ''
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm-out
      - name: Install the packed packages and use the embedded database
        run: node scripts/smoke-installed.mjs npm-out

  npm-publish:
    name: npm publish
    needs: [verify, npm-smoke, release]
    if: needs.verify.outputs.is-release == 'true' && github.repository == 'aevantec/idbseq'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance (and trusted publishing where set up)
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@11.21.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm-out
      - name: Publish the platform packages, then idbseq, then idbseq-mcp
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
          # An npm token that may publish @idbseq/*, idbseq and idbseq-mcp (see docs/releasing.md).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          publish() {
            local tarball="$1" name="$2"
            # A re-run after a partial failure skips what is already out.
            if npm view "${name}@${VERSION}" version > /dev/null 2>&1; then
              echo "${name}@${VERSION} is already published"
              return
            fi
            npm publish "${tarball}" --provenance --access public --tag "${DIST_TAG}"
          }
          for tarball in npm-out/idbseq-*-"${VERSION}".tgz; do
            target="$(basename "${tarball}" "-${VERSION}.tgz")"
            target="${target#idbseq-}"
            [[ "${target}" == "mcp" ]] && continue
            publish "${tarball}" "@idbseq/${target}"
          done
          publish "npm-out/idbseq-${VERSION}.tgz" idbseq
          publish "npm-out/idbseq-mcp-${VERSION}.tgz" idbseq-mcp

  crates:
    name: crates.io (idbseq-core, idbseq)
    needs: [verify, release]
    if: needs.verify.outputs.is-release == 'true' && github.repository == 'aevantec/idbseq'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Publish
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for crate in idbseq-core idbseq; do
            # A re-run after a partial failure skips what is already out.
            if curl -fsS -A "idbseq-release (github.com/aevantec/idbseq)" \
                "https://crates.io/api/v1/crates/${crate}/${VERSION}" > /dev/null 2>&1; then
              echo "${crate} ${VERSION} is already published"
              continue
            fi
            # cargo waits until crates.io serves idbseq-core before idbseq is built.
            cargo publish --locked -p "${crate}"
          done
