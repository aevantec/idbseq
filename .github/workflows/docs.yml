name: Docs

# Builds the VitePress site from docs/ (plus the SDK and CLI READMEs it includes)
# and checks links on every change. Deploys to GitHub Pages only from the public
# repository, on release tags and on demand. One-time setup: docs/releasing.md.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'docs/**'
      - 'api/openapi.json'
      - 'README.md'
      - 'sdk/*/README.md'
      - 'crates/*/README.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'api/openapi.json'
      - 'README.md'
      - 'sdk/*/README.md'
      - 'crates/*/README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # "last updated" dates come from git history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (fails on dead internal links)
        run: npm run build
      - name: Upload for GitHub Pages
        if: >-
          github.repository == 'aevantec/idbseq' &&
          (startsWith(github.ref, 'refs/tags/v') ||
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Markdown links (relative files and external URLs)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --exclude-loopback
            --root-dir ${{ github.workspace }}/docs/public
            --exclude '^https://github\.com/aevantec/idbseq'
            --exclude '^https://aevantec\.github\.io/idbseq'
            --exclude '^https://www\.npmjs\.com/package/idbseq'
            --exclude '^https://crates\.io/crates/'
            --exclude 'example\.com'
            --exclude 'ids\.internal'
            --exclude-path docs/node_modules
            'docs/**/*.md' README.md 'sdk/*/README.md' 'crates/*/README.md'

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, links]
    if: >-
      github.repository == 'aevantec/idbseq' &&
      (startsWith(github.ref, 'refs/tags/v') ||
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
