name: SDKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sdks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Rust toolchain from rust-toolchain.toml (for the embedded database module)
        working-directory: .
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the embedded database module
        run: npm run build:native -- --debug
      - name: Typecheck
        run: npm run typecheck
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Unit tests with coverage gate (80%)
        run: npm test
      - name: Build ESM + CJS and load both; processes sharing an embedded file
        run: npm run test:package

  embedded:
    # The embedded database on each desktop OS: file locking and paths differ.
    name: Embedded database (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - name: Install Rust toolchain from rust-toolchain.toml
        working-directory: .
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Rust tests of the embedded crate (threads and processes on one file)
        working-directory: .
        run: cargo test --locked -p idbseq
      - name: Install
        run: npm ci
      - name: Build the embedded database module
        run: npm run build:native -- --debug
      - name: Node tests of the embedded database
        run: npx vitest run test/embedded.test.ts test/native.test.ts
      - name: Processes sharing one file, through the package
        run: npm run test:package

  mcp:
    name: MCP server (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    defaults:
      run:
        working-directory: sdk/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            sdk/node/package-lock.json
            sdk/mcp/package-lock.json
      - name: Build the Node SDK it depends on (file:../node)
        working-directory: sdk/node
        run: npm ci && npm run build
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests with coverage gate (80%)
        run: npm test
      - name: Build and run --help
        run: npm run build && node dist/cli.js --help

  console:
    name: Admin console (typecheck, unit tests, committed build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/idbseq-server/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/idbseq-server/ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests with coverage gate (80%)
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: The committed dist/ matches the sources
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::crates/idbseq-server/ui/dist is out of date: run 'npm run build' there and commit dist/."
            exit 1
          fi

  e2e:
    name: End-to-end against idbseqd (SDKs, MCP server, CLI, examples, console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            sdk/node/package-lock.json
            sdk/mcp/package-lock.json
            crates/idbseq-server/ui/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK dependencies
        run: |
          (cd sdk/node && npm ci && npm run build)
          (cd sdk/mcp && npm ci)
          (cd crates/idbseq-server/ui && npm ci && npx playwright install --with-deps chromium)
      - name: Run every client against a throwaway server
        run: scripts/e2e.sh
