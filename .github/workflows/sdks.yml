name: SDKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sdks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests with coverage gate (80%)
        run: npm test
      - name: Build ESM + CJS and load both
        run: npm run test:package

  php:
    name: PHP SDK (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', 'latest']
    defaults:
      run:
        working-directory: sdk/php
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2
      - name: Install
        # No lock file: a library is tested against the newest dependencies
        # that support each PHP version.
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: PHPStan (level 8)
        run: composer phpstan
      - name: Unit tests with coverage gate (80%)
        run: composer test:coverage

  e2e:
    name: End-to-end against idbseqd (SDKs, CLI, examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          coverage: none
          tools: composer:v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK dependencies
        run: |
          (cd sdk/node && npm ci)
          (cd sdk/php && composer update --no-interaction --no-progress --prefer-dist)
      - name: Run every client against a throwaway server
        run: scripts/e2e.sh
