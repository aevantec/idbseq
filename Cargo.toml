[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/aevantec/idbseq"
homepage = "https://aevantec.github.io/idbseq/"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "4.5"
proptest = "1.12"
tempfile = "3.27"
criterion = "0.8"
thiserror = "2"
# Published together with idbseq, at the same version (the release checklist in
# docs/releasing.md bumps both numbers).
idbseq-core = { path = "crates/idbseq-core", version = "=0.1.1" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
